name: Install site from ZIP

on:
  push:
    paths:
      - "churuchubu-replit-complete-deploy.zip"
      - ".github/workflows/unpack-site.yml"

permissions:
  contents: write

jobs:
  unpack:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack complete Replit site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site
          unzip -q "churuchubu-replit-complete-deploy.zip" -d _site

          # Keep only the GitHub workflow and the source ZIP at repository root.
          find . -mindepth 1 -maxdepth 1             ! -name '.git'             ! -name '.github'             ! -name 'churuchubu-replit-complete-deploy.zip'             -exec rm -rf {} +

          # Copy the complete application tree into the repository root.
          cp -a _site/. .
          rm -rf _site

          # Never commit the deployment helper ZIP itself into the published tree.
          rm -f .gitkeep

      - name: Commit extracted site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- "churuchubu-replit-complete-deploy.zip" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Deploy complete Replit site [skip ci]"
          git push
